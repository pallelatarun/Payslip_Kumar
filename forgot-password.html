<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - NR Softech</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    .message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #4285f4;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="header-section" style="text-align: center;">
      <img src="assets/logo.jpeg" alt="Company Logo" style="width: 150px; margin-bottom: 10px;">
      <h2>NR Softech Pvt Ltd.</h2>
      <h3>Hyderabad,Telangana-500062</h3>
      <h4>Forgot Password</h4>
    </div>

    <form id="forgotPasswordForm" style="margin-top: 20px;">
      <div class="input-group">
        <label for="email">Enter your Email</label>
        <input type="email" id="email" placeholder="admin@nrsoftech.com" required>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Send Reset Link</button>

      <div id="statusMessage" class="message"></div>

      <a href="index.html" class="back-link">Back to Login</a>
    </form>
  </div>

  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMessage');

      btn.innerText = 'Sending...';
      btn.disabled = true;

      try {
        const res = await fetch('http://localhost:3000/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
          msg.className = 'message success';
          msg.innerText = 'Password reset email sent! ';
          if (data.previewUrl) {
            console.log("Email Preview URL: ", data.previewUrl);
            alert("For testing: An email was simulated. Check your terminal console!!");
          }
        } else {
          msg.className = 'message error';
          msg.innerText = data.message;
        }
      } catch (err) {
        msg.className = 'message error';
        msg.innerText = 'Error connecting to server.';
      } finally {
        btn.innerText = 'Send Reset Link';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
