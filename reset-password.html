<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - NR Softech</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    .message { margin-top: 15px; font-size: 14px; text-align: center; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header-section" style="text-align: center;">
      <div class="company-details">
        <img src="assets/logo.jpeg" alt="Company Logo" style="width: 150px; margin-bottom: 10px;">
        <h2>NR Softech Pvt Ltd.</h2>
        <h3>Hyderabad,Telangana-500062</h3>
        <h4 style="margin-top: 5px;">Reset Password</h4>
      </div>
    </div>

    <form id="resetPasswordForm" style="margin-top: 20px;">
      <div class="input-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" 
               pattern="[A-Za-z0-9!@#$%^&*()_+={}\[\]|\\:;'<>,.?/~`-]+" required title="Accepts alphabets, numbers, and special characters">
      </div>
      
      <div class="input-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Submit</button>
      
      <div id="statusMessage" class="message"></div>
    </form>
  </div>

  <script>
    // Extract token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('statusMessage').className = 'message error';
      document.getElementById('statusMessage').innerText = 'Invalid or missing reset token.';
      document.getElementById('submitBtn').disabled = true;
    }

    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('statusMessage');

      if (newPassword !== confirmPassword) {
        msg.className = 'message error';
        msg.innerText = 'Passwords do not match.';
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        
        if (data.success) {
          alert('Password updated successfully');
          window.location.href = 'index.html';
        } else {
          msg.className = 'message error';
          msg.innerText = data.message;
        }
      } catch (err) {
        msg.className = 'message error';
        msg.innerText = 'Error connecting to server.';
      }
    });
  </script>
</body>
</html>
